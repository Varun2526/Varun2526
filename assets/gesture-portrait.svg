    .sc{fill:#00d2ff;opacity:.10;animation:scan 3.2s ease-in-out infinite}
    .lb{fill:#5b6270;font-family:ui-monospace,Menlo,monospace;font-size:8px;letter-spacing:1px}
    .lb2{fill:#35e07f;font-family:ui-monospace,Menlo,monospace;font-size:8px;letter-spacing:1px}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes scan{0%{transform:translateY(6px)}50%{transform:translateY(150px)}100%{transform:translateY(6px)}}
    </style>
